name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-lint-test:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: make build

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Run unit tests
        run: make test

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify git and tmux
        run: |
          git --version
          tmux -V

      - name: Run integration tests
        run: |
          # Run tests inside a tmux session (required for tmux window operations)
          tmux new-session -d -s ci -x 120 -y 40
          tmux send-keys -t ci "make test-integration; echo \$? > /tmp/exitcode" Enter
          # Wait for tests to complete
          while [ ! -f /tmp/exitcode ]; do sleep 2; done
          tmux kill-session -t ci 2>/dev/null || true
          exit $(cat /tmp/exitcode)
        env:
          WT_INTEGRATION_TEST: 1
