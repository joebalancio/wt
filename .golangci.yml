# golangci-lint configuration
# AI-friendly: Well-documented rules with clear error messages

run:
  # Timeout for analysis
  timeout: 5m
  # Include test files
  tests: true
  # Which dirs to skip
  skip-dirs:
    - vendor
    - bin
  # Which files to skip
  skip-files:
    - ".*\\.pb\\.go$"

output:
  # Format: colored-line-number|line-number|json|tab|checkstyle
  formats:
    - format: colored-line-number
  # Print lines of code with issue
  print-issued-lines: true
  # Print linter name in the end of issue text
  print-linter-name: true
  # Make issues output unique by line
  uniq-by-line: true
  # Sort results by: filepath, line and column
  sort-results: true

linters:
  # Disable all linters
  disable-all: true
  # Enable specific linters (AI-friendly: stable, well-documented)
  enable:
    # Bugs
    - errcheck        # Check for unchecked errors
    - gosimple        # Simplify code
    - govet           # Reports suspicious constructs
    - ineffassign     # Detect ineffectual assignments
    - staticcheck     # Go static analysis
    - typecheck       # Type-check Go code
    - unused          # Check for unused constants, variables, functions and types

    # Style
    - gofmt           # Check whether code was gofmt-ed
    - misspell        # Find commonly misspelled English words
    - revive          # Fast, configurable, extensible, flexible, and beautiful linter

    # Complexity
    - gocyclo         # Compute cyclomatic complexities
    - gocognit        # Compute cognitive complexities

    # Performance
    - prealloc        # Find slice declarations that could potentially be preallocated

linters-settings:
  errcheck:
    # Report about not checking of errors in type assertions: `a := b.(MyStruct)`
    check-type-assertions: true
    # List of functions to exclude from checking
    exclude-functions:
      - (io.Closer).Close

  gocyclo:
    # Minimal code complexity to report
    min-complexity: 15

  gocognit:
    # Minimal code complexity to report
    min-complexity: 20

  govet:
    # Enable all analyzers
    enable-all: true
    # Disable specific analyzers that are too noisy
    disable:
      - shadow
      - fieldalignment

  revive:
    # Enable all rules
    enable-all-rules: false
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id

  misspell:
    # Correct spellings using locale preferences
    locale: US

  staticcheck:
    # Select specific checks
    checks: ["all", "-SA1004", "-SA1019"]

issues:
  # Maximum issues count per one linter
  max-issues-per-linter: 0
  # Maximum count of issues with the same text
  max-same-issues: 0
  # Show only new issues
  new: false
  # Exclude specific issues
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
