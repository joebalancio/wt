# golangci-lint configuration
# AI-friendly: Well-documented rules with clear error messages

version: "2"

run:
  # Timeout for analysis
  timeout: 5m
  # Include test files
  tests: true

linters:
  # Use none as default to explicitly enable linters
  default: none
  # Enable specific linters (AI-friendly: stable, well-documented)
  enable:
    # Bugs
    - errcheck        # Check for unchecked errors
    - govet           # Reports suspicious constructs
    - ineffassign     # Detect ineffectual assignments
    - staticcheck     # Go static analysis (includes gosimple)
    - unused          # Check for unused constants, variables, functions and types

    # Style
    - misspell        # Find commonly misspelled English words
    - revive          # Fast, configurable, extensible, flexible, and beautiful linter

    # Complexity
    - gocyclo         # Compute cyclomatic complexities
    - gocognit        # Compute cognitive complexities

    # Performance
    - prealloc        # Find slice declarations that could potentially be preallocated

  # Exclusions (replaces issues.exclude-rules, exclude-dirs, exclude-files)
  exclusions:
    # Exclude some linters from running on test files
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - gocognit
          - errcheck
    # Directories to exclude from analysis
    paths:
      - vendor
      - bin
      - ".*\\.pb\\.go$"

  settings:
    errcheck:
      # Report about not checking of errors in type assertions: `a := b.(MyStruct)`
      check-type-assertions: true
      # List of functions to exclude from checking
      exclude-functions:
        - (io.Closer).Close

    gocyclo:
      # Minimal code complexity to report
      min-complexity: 15

    gocognit:
      # Minimal code complexity to report
      min-complexity: 20

    govet:
      # Enable all analyzers
      enable-all: true
      # Disable specific analyzers that are too noisy
      disable:
        - shadow
        - fieldalignment

    revive:
      # Enable all rules
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    misspell:
      # Correct spellings using locale preferences
      locale: US

    staticcheck:
      # Select specific checks
      checks: ["all", "-SA1004", "-SA1019"]

formatters:
  enable:
    - gofmt           # Check whether code was gofmt-ed

issues:
  # Maximum issues count per one linter
  max-issues-per-linter: 0
  # Maximum count of issues with the same text
  max-same-issues: 0
  # Make issues output unique by line
  uniq-by-line: true
