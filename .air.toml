# air configuration for hot-reload development
# Install: go install github.com/cosmtrek/air@latest

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Command to build
  cmd = "go build -o ./tmp/wt ./cmd/wt"
  # Binary name
  bin = "tmp/wt"
  # Include these extensions
  include_ext = ["go", "yaml", "yml"]
  # Exclude these extensions
  exclude_ext = ["_test.go"]
  # Include these directories
  include_dir = []
  # Exclude these directories
  exclude_dir = ["tmp", "vendor", "bin"]
  # Exclude these files
  exclude_file = []
  # Exclude specific regex
  exclude_regex = ["_test\\.go"]
  # Watch these files
  exclude_unchanged = false
  # Follow symlink for files
  follow_symlink = false
  # Poll interval (files)
  poll = false
  # Poll interval (ms)
  poll_interval = 500
  # Delay before build
  delay = 0
  # Stop old binary
  stop_on_root = false
  # Send interrupt signal before kill
  send_interrupt = false
  # Kill delay
  kill_delay = 0

[log]
  # Show log time
  time = false
  # Only show main log
  main_only = false

[color]
  # Customize color
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Clean up tmp dir on exit
  clean_on_exit = false

[screen]
  clear_on_rebuild = true
  keep_scroll = true
